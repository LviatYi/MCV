schema = "air.prompt-composition.v1"
description = "Compose a default global prompt for Codex with shared and capability-specific layers."

instruction_layers = [
  "base-prompt.md",
  "example-codex-agent-product-prompt.md",
  "rg-capability-prompt.md",
  "shell-capability-prompt.md",
]

skill_layers = [
  "quiz-professor",
  "source-code-learning-coach",
]

[targets]
product = "codex"

[targets.scope]
type = "global"

[rules]
separator = "\n\n"
